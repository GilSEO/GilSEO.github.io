<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Minifier Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />

    <style>
      h1,
      h2 {
        color: #333;
      }
      textarea {
        width: 100%;
        height: 150px;
        margin-bottom: 10px;
        font-family: monospace;
        padding: 8px;
      }
      .output-wrapper {
        position: relative;
        margin-bottom: 20px;
      }
      .output-container {
        width: 100%;
        height: 150px;
        border: 1px solid #ccc;
        padding: 8px;
        overflow: auto;
        font-family: monospace;
        background-color: #f5f5f5;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .button-container {
        margin: 10px 0 20px 0;
        display: flex;
        gap: 10px;
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #45a049;
      }
      .copy-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: #6c757d;
        color: white;
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        z-index: 10;
      }
      .copy-btn:hover {
        background-color: #5a6268;
      }
      .options-container {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .option-row {
        margin-bottom: 10px;
      }
      #stats {
        background-color: #e8f5e9;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
      }
      .toast {
        visibility: hidden;
        min-width: 200px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 16px;
        position: fixed;
        z-index: 1000;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
      }
      .toast.show {
        visibility: visible;
        animation: fadein 0.5s, fadeout 0.5s 2s;
      }
      .debug-area {
        font-size: 12px;
        margin-top: 20px;
        padding: 10px;
        background-color: #f8f9fa;
        border: 1px solid #ddd;
        border-radius: 4px;
        display: none;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img src="images\lametoolslogo.jpg" alt="Logo" width="45" height="45" class="d-inline-block" />
          GLT
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Tools</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/dealeronmapgen.html">DealerOn Map Gen</a></li>
                <li><a class="dropdown-item" href="/htmlMinifier.html">HTML Minifier</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <h1>HTML Minifier Tool</h1>

      <h2>Input HTML</h2>
      <textarea id="html-input" placeholder="Paste your HTML here..."></textarea>

      <div class="button-container">
        <button id="minifyButton">Basic Minify</button>
        <button id="debug-toggle" style="background-color: #6c757d">Toggle Debug Info</button>
      </div>

      <h2>Output</h2>
      <div class="output-wrapper">
        <div class="output-container" id="output"></div>
        <button class="copy-btn" id="copy-basic">Copy</button>
      </div>

      <h2>Advanced Options</h2>
      <div class="options-container">
        <div class="option-row">
          <input type="checkbox" id="remove-html-comments" checked />
          <label for="remove-html-comments">Remove HTML Comments</label>
        </div>

        <div class="option-row">
          <input type="checkbox" id="remove-css-comments" checked />
          <label for="remove-css-comments">Remove CSS Comments</label>
        </div>

        <div class="option-row">
          <input type="checkbox" id="collapse-whitespace" checked />
          <label for="collapse-whitespace">Collapse Whitespace</label>
        </div>

        <div class="option-row">
          <input type="checkbox" id="preserve-span-spacing" checked />
          <label for="preserve-span-spacing">Preserve Span Spacing</label>
        </div>

        <div class="option-row">
          <input type="checkbox" id="preserve-pre" checked />
          <label for="preserve-pre">Preserve Line Breaks in Pre</label>
        </div>

        <div class="option-row">
          <input type="checkbox" id="remove-quotes" />
          <label for="remove-quotes">Remove Attribute Quotes</label>
        </div>
      </div>

      <div class="button-container">
        <button id="advancedMinifyButton">Advanced Minify</button>
      </div>

      <h2>Advanced Output</h2>
      <div class="output-wrapper">
        <div class="output-container" id="html-output"></div>
        <button class="copy-btn" id="copy-advanced">Copy</button>
      </div>

      <h2>Statistics</h2>
      <div id="stats">Minify your HTML to see statistics</div>

      <!-- Debug Area -->
      <div id="debug-area" class="debug-area">
        <h3>Debug Information</h3>
        <div>
          <h4>Raw Basic Minified Content:</h4>
          <div id="raw-basic-debug" style="overflow: auto; max-height: 100px; font-family: monospace; font-size: 10px; word-break: break-all"></div>
        </div>
        <div>
          <h4>Raw Advanced Minified Content:</h4>
          <div id="raw-advanced-debug" style="overflow: auto; max-height: 100px; font-family: monospace; font-size: 10px; word-break: break-all"></div>
        </div>
      </div>

      <!-- Toast notification for copy feedback -->
      <div id="toast-notification" class="toast">Copied to clipboard!</div>
    </div>

    <script>
      /**
       * Ultra-aggressive HTML minification that removes ALL unnecessary whitespace
       * @param {string} html - The HTML content to minify
       * @return {string} - The minified HTML content
       */
      function minifyHTML(html) {
        if (!html) return "";

        // Step 1: Store pre blocks to protect their content
        const preBlocks = [];
        let processedHtml = html.replace(/<pre\b[^>]*>([\s\S]*?)<\/pre>/gi, function (match) {
          preBlocks.push(match);
          return `###PRE_BLOCK_${preBlocks.length - 1}###`;
        });

        // Step 2: Store span elements to preserve their spacing
        const spanElements = [];
        processedHtml = processedHtml.replace(/(<span\b[^>]*>)([\s\S]*?)(<\/span>)/gi, function (match, openTag, content, closeTag) {
          spanElements.push({ openTag, content, closeTag });
          return `###SPAN_${spanElements.length - 1}###`;
        });

        // Step 3: Remove CSS comments
        processedHtml = processedHtml.replace(/\/\*[\s\S]*?\*\//g, "");

        // Step 4: Remove HTML comments
        processedHtml = processedHtml.replace(/<!--[\s\S]*?-->/g, "");

        // Step 5: Remove whitespace between tags (aggressive)
        let minified = processedHtml
          // Remove whitespace between HTML tags
          .replace(/>\s+</g, "><")
          // Remove whitespace at the beginning of tags
          .replace(/\s+</g, "<")
          // Remove whitespace at the end of tags
          .replace(/>\s+/g, ">")
          // Remove line breaks
          .replace(/\r?\n|\r/g, "")
          // Remove tabs
          .replace(/\t+/g, "")
          // Remove excess spaces
          .replace(/\s{2,}/g, " ")
          // Remove spaces around equals in attributes
          .replace(/\s*=\s*/g, "=");

        // Step 6: Restore span elements with their proper spacing
        spanElements.forEach((span, index) => {
          minified = minified.replace(`###SPAN_${index}###`, `${span.openTag}${span.content}${span.closeTag}`);
        });

        // Step 7: Restore pre blocks
        preBlocks.forEach((block, index) => {
          minified = minified.replace(`###PRE_BLOCK_${index}###`, block);
        });

        return minified;
      }

      /**
       * More advanced HTML minification with additional options
       * @param {string} html - The HTML content to minify
       * @param {Object} options - Configuration options
       * @return {string} - The minified HTML content
       */
      function advancedMinifyHTML(html, options = {}) {
        const defaultOptions = {
          removeHtmlComments: true,
          removeCssComments: true,
          collapseWhitespace: true,
          preserveSpanSpacing: true,
          preserveLineBreaksInPre: true,
          removeAttributeQuotes: false,
        };

        const config = { ...defaultOptions, ...options };
        let result = html;

        // Store pre blocks to protect their content
        const preBlocks = [];
        if (config.preserveLineBreaksInPre) {
          result = result.replace(/<pre\b[^>]*>([\s\S]*?)<\/pre>/gi, function (match) {
            preBlocks.push(match);
            return `###PRE_BLOCK_${preBlocks.length - 1}###`;
          });
        }

        // Store style blocks to handle CSS separately
        const styleBlocks = [];
        result = result.replace(/<style\b[^>]*>([\s\S]*?)<\/style>/gi, function (match, styleContent) {
          let processedStyle = styleContent;

          // Remove CSS comments if enabled
          if (config.removeCssComments) {
            processedStyle = processedStyle.replace(/\/\*[\s\S]*?\*\//g, "");
          }

          // Minify CSS
          if (config.collapseWhitespace) {
            processedStyle = processedStyle
              .replace(/\s*\{\s*/g, "{")
              .replace(/\s*\}\s*/g, "}")
              .replace(/\s*:\s*/g, ":")
              .replace(/\s*;\s*/g, ";")
              .replace(/\r?\n|\r/g, "")
              .replace(/\s*,\s*/g, ",");
          }

          styleBlocks.push("<style>" + processedStyle + "</style>");
          return `###STYLE_BLOCK_${styleBlocks.length - 1}###`;
        });

        // Store span elements if preserveSpanSpacing is enabled
        const spanElements = [];
        if (config.preserveSpanSpacing) {
          result = result.replace(/(<span\b[^>]*>)([\s\S]*?)(<\/span>)/gi, function (match, openTag, content, closeTag) {
            spanElements.push({ openTag, content, closeTag });
            return `###SPAN_${spanElements.length - 1}###`;
          });
        }

        // Remove HTML comments
        if (config.removeHtmlComments) {
          result = result.replace(/<!--[\s\S]*?-->/g, "");
        }

        // Remove inline CSS comments in style attributes
        if (config.removeCssComments) {
          result = result.replace(/style="([^"]*)"/gi, function (match, styleContent) {
            return 'style="' + styleContent.replace(/\/\*[\s\S]*?\*\//g, "") + '"';
          });
        }

        // Collapse whitespace
        if (config.collapseWhitespace) {
          result = result
            .replace(/>\s+</g, "><")
            .replace(/\s+</g, "<")
            .replace(/>\s+/g, ">")
            .replace(/\r?\n|\r/g, "")
            .replace(/\t+/g, "")
            .replace(/\s{2,}/g, " ")
            .replace(/\s*=\s*/g, "=");
        }

        // Remove attribute quotes where possible
        if (config.removeAttributeQuotes) {
          result = result.replace(/="\s*([a-zA-Z0-9-_]+)\s*"/g, "=$1");
        }

        // Restore span elements with proper spacing
        if (config.preserveSpanSpacing) {
          spanElements.forEach((span, index) => {
            result = result.replace(`###SPAN_${index}###`, `${span.openTag}${span.content}${span.closeTag}`);
          });
        }

        // Restore style blocks
        styleBlocks.forEach((block, index) => {
          result = result.replace(`###STYLE_BLOCK_${index}###`, block);
        });

        // Restore pre blocks
        if (config.preserveLineBreaksInPre) {
          preBlocks.forEach((block, index) => {
            result = result.replace(`###PRE_BLOCK_${index}###`, block);
          });
        }

        return result;
      }

      /**
       * Copy text to clipboard with extra checks to ensure the text remains unformatted
       * @param {string} text - Text to copy to clipboard
       */
      function copyToClipboard(text) {
        if (!text) {
          console.error("No text to copy");
          return;
        }

        // Make extra sure all unnecessary whitespace is removed
        const cleanedText = text.replace(/\r?\n|\r/g, "").replace(/\t/g, "");

        // Update debug area with the actual content being copied
        updateDebugArea();

        // Use the Clipboard API
        navigator.clipboard
          .writeText(cleanedText)
          .then(() => {
            showToast("Copied minified HTML to clipboard");
          })
          .catch((err) => {
            console.error("Clipboard API error: ", err);
            // Fallback method
            const textArea = document.createElement("textarea");
            textArea.value = cleanedText;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();

            try {
              const successful = document.execCommand("copy");
              if (successful) {
                showToast("Copied minified HTML to clipboard");
              } else {
                showToast("Failed to copy - please try again", true);
              }
            } catch (err) {
              console.error("Fallback copy error: ", err);
              showToast("Failed to copy - please try again", true);
            }

            document.body.removeChild(textArea);
          });
      }

      /**
       * Show toast notification
       * @param {string} message - Message to display
       * @param {boolean} isError - Whether this is an error message
       */
      function showToast(message = "Copied to clipboard!", isError = false) {
        const toast = document.getElementById("toast-notification");
        toast.textContent = message;

        if (isError) {
          toast.style.backgroundColor = "#dc3545";
        } else {
          toast.style.backgroundColor = "#333";
        }

        toast.className = "toast show";

        // After 3 seconds, hide the toast
        setTimeout(function () {
          toast.className = toast.className.replace("show", "");
        }, 3000);
      }

      /**
       * Update debug area with current content
       */
      function updateDebugArea() {
        const basicOutput = document.getElementById("output").textContent;
        const advancedOutput = document.getElementById("html-output").textContent;

        document.getElementById("raw-basic-debug").textContent = basicOutput;
        document.getElementById("raw-advanced-debug").textContent = advancedOutput;
      }

      // Variables to store minified content
      let basicMinifiedContent = "";
      let advancedMinifiedContent = "";

      // Basic minify button
      document.getElementById("minifyButton").addEventListener("click", function () {
        const htmlInput = document.getElementById("html-input").value;
        basicMinifiedContent = minifyHTML(htmlInput);

        // Display the minified content
        document.getElementById("output").textContent = basicMinifiedContent;

        // Update debug area
        updateDebugArea();

        // Show statistics for basic minification
        const originalSize = new Blob([htmlInput]).size;
        const minifiedSize = new Blob([basicMinifiedContent]).size;
        const savings = originalSize > 0 ? (((originalSize - minifiedSize) / originalSize) * 100).toFixed(2) : 0;

        document.getElementById("stats").textContent = `Original: ${originalSize} bytes | Minified: ${minifiedSize} bytes | Savings: ${savings}%`;
      });

      // Advanced minify button
      document.getElementById("advancedMinifyButton").addEventListener("click", function () {
        const htmlInput = document.getElementById("html-input").value;

        const options = {
          removeHtmlComments: document.getElementById("remove-html-comments").checked,
          removeCssComments: document.getElementById("remove-css-comments").checked,
          collapseWhitespace: document.getElementById("collapse-whitespace").checked,
          preserveSpanSpacing: document.getElementById("preserve-span-spacing").checked,
          preserveLineBreaksInPre: document.getElementById("preserve-pre").checked,
          removeAttributeQuotes: document.getElementById("remove-quotes").checked,
        };

        advancedMinifiedContent = advancedMinifyHTML(htmlInput, options);

        // Display the minified content
        document.getElementById("html-output").textContent = advancedMinifiedContent;

        // Update debug area
        updateDebugArea();

        // Show statistics
        const originalSize = new Blob([htmlInput]).size;
        const minifiedSize = new Blob([advancedMinifiedContent]).size;
        const savings = originalSize > 0 ? (((originalSize - minifiedSize) / originalSize) * 100).toFixed(2) : 0;

        document.getElementById("stats").textContent = `Original: ${originalSize} bytes | Minified: ${minifiedSize} bytes | Savings: ${savings}%`;
      });

      // Copy button for basic output
      document.getElementById("copy-basic").addEventListener("click", function () {
        const outputText = document.getElementById("output").textContent;
        copyToClipboard(outputText);
      });

      // Copy button for advanced output
      document.getElementById("copy-advanced").addEventListener("click", function () {
        const outputText = document.getElementById("html-output").textContent;
        copyToClipboard(outputText);
      });

      // Toggle debug area
      document.getElementById("debug-toggle").addEventListener("click", function () {
        const debugArea = document.getElementById("debug-area");
        if (debugArea.style.display === "none" || debugArea.style.display === "") {
          debugArea.style.display = "block";
          updateDebugArea();
        } else {
          debugArea.style.display = "none";
        }
      });

      // Add example HTML on page load
      window.addEventListener("load", function () {
        document.getElementById("html-input").value = `<!DOCTYPE html>
<html>
  <head>
    <title>Example HTML</title>
    <style>
      /* This is a CSS comment that should be removed */
      body {
        font-family: Arial, sans-serif;
        color: #333; /* Dark gray text */
      }
      .container {
        margin: 0 auto;
        width: 80%; /* Use 80% of the screen width */
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
    <p>This is a <span>sample</span> paragraph with some text.</p>
    <!-- This is an HTML comment that will be removed -->
    <div style="padding: 20px; /* Add some padding */ color: blue;">
      Inline styles with comments
    </div>
    <pre>
      function example() {
        console.log("This formatting should be preserved");
        // This comment inside pre should be preserved
      }
    </pre>
  </body>
</html>`;
      });
    </script>
  </body>
</html>
